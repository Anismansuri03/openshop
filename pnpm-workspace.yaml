packages:
  - "apps/**"
  - "!apps/backend/.medusa/**"

# CVE-2026-96889 / GHSA-2464-fhr4-w9xw: force sharp >= 0.35.5 for Next.js Image Optimization.
# next@15.5.28 still allows ^0.34.3, so an override is required to escape the locked 0.34.5.
# GHSA-jqcg-44mw-7w3h (critical, IP spoofing via IPv4-mapped): force proxy-addr >= 2.0.8.
# express@4.22.2 declares ~2.0.7, which accepts 2.0.8; the lockfile resolution was stale at 2.0.7.
overrides:
  sharp: ^0.35.5
  proxy-addr: ^2.0.8

# pnpm 11+
allowBuilds:
  "@medusajs/telemetry": true

# pnpm 10.x
onlyBuiltDependencies:
  - "@medusajs/telemetry"
